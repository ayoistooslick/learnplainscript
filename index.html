<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f4ec" />
    <script>
      (() => {
        try {
          const saved = window.localStorage.getItem('learnplainscript.theme.v1');
          const theme = saved === 'dark' || saved === 'light'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#181a15' : '#f7f4ec');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <script>
      (() => {
        try {
          const code = window.localStorage.getItem('learnplainscript.language.v1');
          if (code && /^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(code)) {
            document.documentElement.lang = code;
          }
        } catch {
          // A reading preference is optional; private browsing can refuse storage.
        }
      })();
    </script>
    <meta name="description" content="A garden for learning PlainScript 2.3.1: short illustrated notes, real runnable programs, a practice bench, and a path that remembers your place." />
