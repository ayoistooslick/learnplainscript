    </pattern>
    <pattern id="grain" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="0.55" fill="#17130e" opacity="0.16" />
    </pattern>
  </defs>

  <rect width="900" height="620" fill="#f4edde" />
  <rect x="20" y="20" width="860" height="580" fill="#efe5d2" stroke="#17130e" stroke-width="1.5" />

