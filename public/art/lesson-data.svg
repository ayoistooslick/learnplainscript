<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="A student sorting notes into stacks with arrows between them">
  <defs>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.7" fill="#25231F" opacity="0.05" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F5F0E6" />
  <rect width="800" height="468" fill="#EFE7D8" />
  <rect y="468" width="800" height="132" fill="#E6D6BB" />
  <line x1="0" y1="468" x2="800" y2="468" stroke="#CBB894" stroke-width="3" />

  <!-- pinboard -->
  <rect x="430" y="64" width="320" height="188" rx="4" fill="#C9A272" stroke="#8B5E3C" stroke-width="5" />
  <rect x="446" y="80" width="288" height="156" fill="#E6D6BB" />
  <g stroke="#25231F" stroke-width="3" fill="#FBF7EE">
    <rect x="466" y="104" width="76" height="54" transform="rotate(-3 466 104)" />
    <rect x="566" y="98" width="76" height="54" transform="rotate(2 566 98)" />
    <rect x="466" y="170" width="76" height="46" transform="rotate(1 466 170)" />
  </g>
  <g stroke="#25231F" stroke-width="2.4" opacity="0.55">
    <path d="M478 122 h52 M478 136 h40" />
    <path d="M578 116 h50 M578 130 h34" />
    <path d="M478 186 h48 M478 200 h34" />
  </g>
  <path d="M556 132 q26 0 26 26" stroke="#C96442" stroke-width="4" fill="none" marker-end="url(#arrow)" />
  <path d="M552 150 l-30 14" stroke="#C96442" stroke-width="4" fill="none" />
  <circle cx="544" cy="104" r="4" fill="#C96442" />
  <circle cx="644" cy="98" r="4" fill="#C96442" />
  <circle cx="544" cy="170" r="4" fill="#C96442" />

  <!-- desk -->
  <rect x="56" y="392" width="688" height="20" rx="4" fill="#C9A272" stroke="#25231F" stroke-width="4" />
  <path d="M96 412 v96 M704 412 v96" stroke="#8B5E3C" stroke-width="9" stroke-linecap="round" />

  <!-- card stacks -->
  <g stroke="#25231F" stroke-width="3">
    <rect x="90" y="342" width="104" height="68" rx="3" fill="#FBF7EE" transform="rotate(-4 90 342)" />
    <rect x="98" y="330" width="104" height="68" rx="3" fill="#D9E7D2" transform="rotate(-1 98 330)" />
    <rect x="108" y="316" width="104" height="68" rx="3" fill="#FBF7EE" transform="rotate(2 108 316)" />
    <rect x="250" y="342" width="104" height="68" rx="3" fill="#FBF7EE" transform="rotate(3 250 342)" />
    <rect x="256" y="328" width="104" height="68" rx="3" fill="#E6D6BB" transform="rotate(-2 256 328)" />
    <rect x="264" y="314" width="104" height="68" rx="3" fill="#FBF7EE" transform="rotate(1 264 314)" />
  </g>
  <g stroke="#25231F" stroke-width="2.6" opacity="0.5">
    <path d="M126 340 h58 M126 354 h44 M126 368 h50" />
    <path d="M282 340 h58 M282 354 h44 M282 368 h50" />
  </g>
  <path d="M226 330 q22 -22 44 0" stroke="#C96442" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M266 322 l6 10 l-14 2" fill="none" stroke="#C96442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- student stepping in from the right -->
  <g>
    <path d="M588 468 q0 -94 66 -94 q66 0 66 94 Z" fill="#7E9A72" stroke="#25231F" stroke-width="4" stroke-linejoin="round" />
    <circle cx="654" cy="322" r="42" fill="#E8B98D" stroke="#25231F" stroke-width="4" />
    <path d="M612 320 q-2 -54 44 -54 q46 0 42 52 q-36 -16 -86 2 Z" fill="#3A2A22" stroke="#25231F" stroke-width="4" stroke-linejoin="round" />
    <circle cx="640" cy="322" r="3.2" fill="#25231F" />
    <circle cx="670" cy="322" r="3.2" fill="#25231F" />
    <path d="M646 340 q8 8 16 0" stroke="#25231F" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M604 404 q-44 6 -72 -18" stroke="#7E9A72" stroke-width="20" stroke-linecap="round" fill="none" />
    <path d="M534 386 q-10 0 -14 -8" stroke="#E8B98D" stroke-width="14" stroke-linecap="round" fill="none" />
    <path d="M648 372 q-4 54 -16 76" stroke="#25231F" stroke-width="3" opacity="0.2" fill="none" />
  </g>

  <rect width="800" height="600" fill="url(#grain)" />
</svg>
